
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Thank you for submitting your AEEE Execom application.">

  <title>Submission Successful | AEEE GEC Wayanad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #10110f;
      --lime: #c5f568;
      --white: #f4f3ed;
      --muted: #aaa99f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
      background: var(--bg);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      text-align: center;
    }

    .thankyou-container {
      width: 100%;
      max-width: 760px;
      animation: appear 0.8s ease both;
    }

    .success-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--lime);
      color: var(--bg);
    }

    .success-icon svg {
      width: 43px;
      height: 43px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-label {
      margin: 0 0 25px;
      color: var(--lime);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(38px, 5.2vw, 68px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -2px;
    }

    h1 span {
      display: block;
      color: var(--lime);
    }

    .divider {
      width: 70px;
      height: 4px;
      margin: 38px auto;
      background: var(--lime);
    }

    .message {
      margin: 0;
      color: #d0cfc7;
      font-size: 17px;
      line-height: 2;
    }

    .association {
      margin: 62px 0 0;
      color: #77796e;
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 2px;
    }

    .home-link {
      display: inline-block;
      margin-top: 32px;
      padding: 15px 22px;
      border: 1px solid #3a3c32;
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .home-link:hover {
      border-color: var(--lime);
      background: var(--lime);
      color: var(--bg);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .success-icon {
        width: 76px;
        height: 76px;
      }

      .brand-label {
        font-size: 11px;
        letter-spacing: 3px;
      }

      h1 {
        letter-spacing: -1.5px;
      }

      .message {
        font-size: 15px;
      }

      .association {
        margin-top: 45px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .thankyou-container {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="thankyou-container">

    <div class="success-icon" aria-label="Success">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12.5l4.5 4.5L19 6"></path>
      </svg>
    </div>

    <p class="brand-label">AEEE · GEC WAYANAD</p>

    <h1>
      Thank You for
      <span>Your Submission.</span>
    </h1>

    <div class="divider"></div>

    <p class="message">
      Your application has been received successfully.<br>
      Thank you for your interest in joining the AEEE ExCom.<br>
      We'll be in touch with you soon.
    </p>

    <p class="association">
      ASSOCIATION OF ELECTRICAL &amp; ELECTRONICS ENGINEERS
    </p>

    <a class="home-link" href="index.html">
      BACK TO HOME ↗
    </a>

  </main>

</body>
</html>
